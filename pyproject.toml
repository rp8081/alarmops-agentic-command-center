[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alarmops-agentic-command-center"
version = "1.0.0"
description = "Multi-MCP enterprise alarm operations copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.20,<2",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
notebook = ["ipykernel>=6.29,<8", "jupyterlab>=4.3,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alarmops*", "apps*", "mcp_servers*"]

[tool.pytest.ini_options]
addopts = "-q --cov=alarmops --cov=apps --cov=mcp_servers --cov-report=term-missing --cov-report=html:reports/coverage"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]
